# Local native development only; all credentials below are synthetic fixtures.
name: social-native-dev
x-native: &native
  build: .
  image: social-native:local
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  volumes:
    - private_media:/app/var/media
    - snapshots:/app/var/agent_snapshot
  tmpfs:
    - /app/var/media-work:uid=10001,gid=10001,mode=0700,size=256m
  environment: &native-env
    DATABASE_URL: postgres://app:app@db:5432/app?sslmode=disable
    DJANGO_SECRET_KEY: synthetic-local-fixture-secret-00000001
    SITE_BASE_URL: http://127.0.0.1:8000
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    DJANGO_DEBUG: "true"
    ALLOW_MINOR_ONBOARDING: "false"
    AGENT_SNAPSHOT_DIR: /app/var/agent_snapshot
    MEDIA_STORAGE_BACKEND: local
    MEDIA_ROOT: /app/var/media
    SOCIAL_REACT_UI: "true"
services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *native
    command: [social-server, --migrate-only]
    depends_on:
      db:
        condition: service_healthy
  web:
    <<: *native
    command: [social-server, --dev, --dev-container, --listen, "0.0.0.0:8000", --site-root, /app, --static-dir, /app/static, --media-scratch, /app/var/media-work]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  jobs:
    <<: *native
    profiles: [jobs]
    command: [social-server, --dev, --due, --site-root, /app, --media-scratch, /app/var/media-work]
    depends_on:
      migrate:
        condition: service_completed_successfully
  seed:
    <<: *native
    profiles: [demo]
    command: [social-server, --dev, --job, load_roedu_seed, --site-root, /app, --media-scratch, /app/var/media-work]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  pgdata: {}
  private_media: {}
  snapshots: {}
