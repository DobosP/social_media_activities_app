# Optional native development override; no ingestion runs on startup.
# Layer onto docker-compose.yml (native Go), not a legacy Python local variant.
# Owner-authorized commands use: social-server --job ingest_places --job-options -
# with a strict JSON object such as source/city/dry_run; see docs/ROEDU_INTEGRATION.md.
# Native source clients accept HTTPS or explicit loopback fixture URLs. This host-gateway
# alias cannot reach a loopback-only data server; do not widen that server's bind address.
# Prefer its approved HTTP boundary or synthetic fixtures; no real ingestion from a code task.
services:
  web:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ROEDU_API_URL: "${ROEDU_API_URL:?Supply the approved HTTPS serving URL}"
      ROEDU_API_KEY: "${ROEDU_API_KEY:?Supply the scoped key through the secret bundle}"
      INGESTION_EXTRA_ADAPTERS: '{"roedu": "roedu"}'
