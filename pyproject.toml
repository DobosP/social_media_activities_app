[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.format]
# Black-compatible defaults.
#
# `_roedu_client_core.py` is generated by the producer's scripts/sync_roedu_client.py
# (romania_scraper ADR-0069) and carries a VENDORED_SHA256 of its own body: running the
# formatter over it is a hand-edit, which test_roedu_client_vendored.py fails by design.
# The canonical file is not format-clean under the producer's own ruff either, so a
# resync cannot settle this — the style rule and the stamp are simply in conflict, and
# the stamp wins. Excluded from the FORMATTER ONLY: `ruff check` still lints it, so a
# real defect arriving through a resync is still caught here. roedu-engines carves its
# copy out of E501 the same way.
exclude = ["apps/ingestion/sources/_roedu_client_core.py"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--reuse-db"
asyncio_mode = "auto"
