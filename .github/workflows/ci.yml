name: Native project CI

# Owner-selected on-demand policy; no automatic push/PR/schedule activation.
on:
  workflow_dispatch:
    inputs:
      audit_only:
        description: Run native dependency audits without build/test jobs
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    if: ${{ !inputs.audit_only }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Browser contracts, typecheck, build and bundle budget
        run: npm test && npm run build

  native:
    uses: ./.github/workflows/native.yml
    with:
      audit_only: ${{ inputs.audit_only }}

  public-api:
    uses: ./.github/workflows/go.yml
    with:
      audit_only: ${{ inputs.audit_only }}
