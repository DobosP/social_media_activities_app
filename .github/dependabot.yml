# Opens update PRs for review (we do NOT auto-merge security bumps — see
# docs/SECURITY.md). Keeps pinned deps and GitHub Actions current.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["ci"]
  - package-ecosystem: gomod
    directory: "/services/agentapi"
    schedule:
      interval: weekly
    labels: ["dependencies"]
  - package-ecosystem: docker
    directory: "/services/agentapi"
    schedule:
      interval: weekly
    labels: ["dependencies"]
  - package-ecosystem: gomod
    directory: "/services/server"
    schedule:
      interval: weekly
    labels: ["dependencies"]
  - package-ecosystem: gomod
    directory: "/services/authcore"
    schedule:
      interval: weekly
    labels: ["dependencies"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]
